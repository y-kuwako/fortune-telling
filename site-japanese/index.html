<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>御神籤 ― 九星気学 | 和風占い処</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../css/nav.css?v=1">
</head>
<body>

  <!-- Global Navigation -->
  <nav class="nav" aria-label="グローバルナビゲーション">
    <a href="../index.html" class="nav__link">
      <span class="nav__icon">&#9671;</span> TOP
    </a>
    <a href="../astrology-v2.html#hack" class="nav__link">
      <span class="nav__icon">&#9671;</span> Today's アドバイス
    </a>
    <a href="../astrology-v2.html#month" class="nav__link">
      <span class="nav__icon">&#9671;</span> This month's スケジュール
    </a>
    <a href="../astrology-v2.html#year" class="nav__link">
      <span class="nav__icon">&#9671;</span> This year's スケジュール
    </a>
    <a href="../astrology-v2.html#core" class="nav__link">
      <span class="nav__icon">&#9671;</span> あなたの基本構成
    </a>
    <a href="../celestia/tarot.html" class="nav__link">
      <span class="nav__icon">&#9826;</span> タロット占い
    </a>
    <a href="../astrology-v2.html" class="plan-badge" title="プランを変更">
      <span class="plan-badge__label">PLAN</span>
      <span class="plan-badge__value">FREE</span>
    </a>
  </nav>

  <div class="washi-overlay"></div>

  <main class="container">

    <!-- 門構え Header -->
    <header class="shrine-header">
      <div class="kamon"></div>
      <div class="decorative-line">━━━ ◉ ━━━</div>
      <h1 class="main-title">占 い 処</h1>
      <p class="subtitle">― 和風電脳神社 ―</p>
      <div class="decorative-line">━━━ ◉ ━━━</div>
    </header>

    <!-- 縦罫 divider -->
    <div class="tate-divider">
      <span class="tate-line">┃</span>
    </div>

    <!-- おみくじ Section -->
    <section class="omikuji-section" id="omikuji">
      <div class="section-header">
        <div class="kamon kamon-small"></div>
        <h2 class="section-title">御 神 籤</h2>
        <p class="section-subtitle">心静かに、一枚お引きください</p>
      </div>

      <div class="omikuji-box" id="omikujiBox">
        <div class="omikuji-box-inner">
          <div class="omikuji-label">御<br>神<br>籤</div>
          <div class="omikuji-sticks">
            <span>｜</span><span>｜</span><span>｜</span>
            <span>｜</span><span>｜</span><span>｜</span>
          </div>
        </div>
      </div>

      <button class="ema-button" id="drawBtn" onclick="drawOmikuji()">
        <span class="ema-text">引 く</span>
      </button>

      <!-- おみくじ結果 -->
      <div class="omikuji-result" id="omikujiResult">
        <div class="result-stamp" id="resultStamp">
          <span class="stamp-text" id="fortuneLevel"></span>
        </div>
        <div class="waka-box" id="wakaBox">
          <p class="waka-text" id="wakaText"></p>
        </div>
        <div class="fortune-categories" id="fortuneCategories">
          <!-- filled by JS -->
        </div>
      </div>
    </section>

    <!-- 縦罫 divider -->
    <div class="tate-divider">
      <span class="tate-line">┃</span>
    </div>

    <!-- 九星気学 Section -->
    <section class="kyusei-section" id="kyusei">
      <div class="section-header">
        <div class="kamon kamon-small"></div>
        <h2 class="section-title">九 星 気 学</h2>
        <p class="section-subtitle">生年月日より、あなたの本命星を占います</p>
      </div>

      <div class="kyusei-form">
        <div class="input-group">
          <label class="input-label" for="birthYear">生年</label>
          <div class="input-wrapper">
            <input type="number" id="birthYear" min="1920" max="2026" placeholder="例：1990">
            <span class="input-suffix">年</span>
          </div>
        </div>
        <div class="input-group">
          <label class="input-label" for="birthMonth">生月</label>
          <div class="input-wrapper">
            <input type="number" id="birthMonth" min="1" max="12" placeholder="例：6">
            <span class="input-suffix">月</span>
          </div>
        </div>
        <div class="input-group">
          <label class="input-label" for="birthDay">生日</label>
          <div class="input-wrapper">
            <input type="number" id="birthDay" min="1" max="31" placeholder="例：15">
            <span class="input-suffix">日</span>
          </div>
        </div>

        <button class="ema-button" onclick="calculateKyusei()">
          <span class="ema-text">占 う</span>
        </button>
      </div>

      <!-- 九星結果 -->
      <div class="kyusei-result" id="kyuseiResult">
        <div class="kyusei-star" id="kyuseiStar">
          <div class="star-circle" id="starCircle">
            <span class="star-name" id="starName"></span>
          </div>
        </div>
        <div class="kyusei-element" id="kyuseiElement"></div>
        <div class="kyusei-fortune" id="kyuseiFortune"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="shrine-footer">
      <div class="decorative-line">━━━ 〇 ━━━</div>
      <p class="footer-text">占いは心の道しるべ<br>よき日をお過ごしください</p>
      <div class="decorative-line">━━━ 〇 ━━━</div>
    </footer>

  </main>

  <script src="script.js"></script>
  <script src="../js/nav.js?v=1"></script>
</body>
</html>
