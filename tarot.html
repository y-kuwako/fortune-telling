<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タロット占い - Celestia</title>
  <meta name="description" content="タロットカードを直感で選んで、今のあなたへのメッセージを受け取りましょう。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header__logo">Celestia</div>
    <h1 class="header__title">タロット占い</h1>
    <p class="header__subtitle">直感で1枚、選んでください</p>
  </header>

  <!-- Navigation -->
  <nav class="nav">
    <a href="index.html" class="nav__link">
      <span class="nav__icon">🏠</span>TOP
    </a>
    <a href="tarot.html" class="nav__link nav__link--active">
      <span class="nav__icon">🃏</span>タロット
    </a>
    <a href="astrology.html" class="nav__link">
      <span class="nav__icon">🌟</span>命術占い
    </a>
  </nav>

  <div class="container">

    <!-- Phase 1: Start -->
    <div id="phase-start" class="tarot-stage">
      <div class="hero__symbol">🃏</div>
      <h2 class="hero__heading">タロット占い</h2>
      <p class="hero__text">
        心を落ち着けて、深呼吸をしましょう。<br>
        準備ができたらシャッフルを始めてください。
      </p>
      <button id="btn-shuffle" class="btn btn--gold" onclick="startShuffle()">
        シャッフルする
      </button>
    </div>

    <!-- Phase 2: Shuffling -->
    <div id="phase-shuffle" class="tarot-stage hidden">
      <p class="tarot-stage__message">カードをシャッフル中...</p>
      <div class="shuffle-area">
        <div class="shuffle-card"></div>
        <div class="shuffle-card"></div>
        <div class="shuffle-card"></div>
      </div>
      <p class="tarot-stage__message" style="font-size: 0.8rem; color: var(--text-muted);">
        心の中で質問を思い浮かべてください
      </p>
    </div>

    <!-- Phase 3: Select -->
    <div id="phase-select" class="tarot-stage hidden">
      <p class="tarot-stage__message">直感で1枚、選んでください</p>
      <div id="card-grid" class="card-grid">
        <!-- Cards generated by JS -->
      </div>
    </div>

    <!-- Phase 4: Result -->
    <div id="phase-result" class="hidden">
      <div class="result">
        <div class="result__card-display">
          <div id="result-icon" class="result__card-icon"></div>
          <h2 id="result-name" class="result__card-name"></h2>
          <p id="result-subtitle" class="result__card-subtitle"></p>
        </div>

        <div class="result__box">
          <div class="result__box-title">🔮 カードのメッセージ</div>
          <p id="result-message" class="result__box-text"></p>
        </div>

        <div class="result__box">
          <div class="result__box-title">💫 ワンポイントアドバイス</div>
          <p id="result-advice" class="result__box-text"></p>
        </div>

        <div class="result__box">
          <div class="result__box-title">🍀 ラッキーポイント</div>
          <p id="result-lucky" class="result__box-text"></p>
        </div>

        <div class="divider">share</div>
        <div class="share">
          <button class="share__btn" onclick="shareTwitter()" title="Xでシェア">𝕏</button>
          <button class="share__btn" onclick="shareLine()" title="LINEでシェア">💬</button>
        </div>

        <div class="result__actions">
          <button class="btn btn--primary btn--block" onclick="resetTarot()">もう一度占う</button>
          <a href="astrology.html" class="btn btn--outline btn--block">命術占いも試す →</a>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="footer">
    <p class="footer__text">&copy; 2026 Celestia - All rights reserved.</p>
    <div class="footer__links">
      <a href="#">利用規約</a>
      <a href="#">プライバシーポリシー</a>
    </div>
  </footer>

  <script src="js/tarot.js"></script>
</body>
</html>
