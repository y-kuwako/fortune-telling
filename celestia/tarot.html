<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タロット占い - x-TEN</title>
  <meta name="description" content="タロットカードを直感で選んで、今のあなたへのメッセージを受け取りましょう。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <a href="../index.html" class="nav__link">
      <span class="nav__icon">&#9671;</span> TOP
    </a>
    <a href="tarot.html" class="nav__link nav__link--active">
      <span class="nav__icon">&#9826;</span> TAROT
    </a>
    <a href="astrology.html" class="nav__link">
      <span class="nav__icon">&#9734;</span> ASTROLOGY
    </a>
  </nav>

  <!-- Phase 1: Start -->
  <div id="phase-start" class="section-dark">
    <div class="container">
      <div class="page-hero">
        <div class="deco-divider">&#10023; &#10023; &#10023;</div>
        <h1 class="page-hero__title">直感で選んで！<br>あなたの今週の運勢</h1>
        <p class="page-hero__desc">
          STARTボタンを押すとシャッフルが始まります。<br>
          心を落ち着けて、深呼吸をしてから<br>
          直感で1枚お選びください。
        </p>
      </div>
      <div class="tarot-stage">
        <button id="btn-shuffle" class="btn btn--dark" onclick="startShuffle()">
          START
        </button>
      </div>
    </div>
  </div>

  <!-- Phase 2: Shuffling -->
  <div id="phase-shuffle" class="section-dark hidden">
    <div class="container">
      <div class="tarot-stage">
        <p class="tarot-stage__message">カードをシャッフルしています...</p>
        <div class="shuffle-area">
          <div class="shuffle-card"></div>
          <div class="shuffle-card"></div>
          <div class="shuffle-card"></div>
        </div>
        <p class="tarot-stage__message--sub">心の中で質問を思い浮かべてください</p>
      </div>
    </div>
  </div>

  <!-- Phase 3: Select -->
  <div id="phase-select" class="section-dark hidden">
    <div class="container">
      <div class="tarot-stage">
        <p class="tarot-stage__message">直感で1枚、選んでください</p>
        <div id="card-fan" class="card-fan">
          <!-- Cards generated by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Phase 4: Result -->
  <div id="phase-result" class="section-dark hidden">
    <div class="container">
      <div class="result">
        <div class="result__card-display">
          <div id="result-icon" class="result__card-icon"></div>
          <h2 id="result-name" class="result__card-name"></h2>
          <p id="result-name-en" class="result__card-name-en"></p>
          <p class="result__card-subtitle">あなたへのメッセージ</p>
        </div>

        <div class="result__box">
          <div class="result__box-title">&#10023; カードのメッセージ</div>
          <p id="result-message" class="result__box-text"></p>
        </div>

        <div class="result__box">
          <div class="result__box-title">&#10023; ワンポイントアドバイス</div>
          <p id="result-advice" class="result__box-text"></p>
        </div>

        <div class="result__box">
          <div class="result__box-title">&#10023; ラッキーポイント</div>
          <p id="result-lucky" class="result__box-text"></p>
        </div>

        <div class="share-section">
          <p class="share-section__label">S H A R E</p>
          <div class="share">
            <button class="share__btn" onclick="shareTwitter()" title="Xでシェア">&#120143;</button>
            <button class="share__btn" onclick="shareLine()" title="LINEでシェア">L</button>
          </div>
        </div>

        <div class="result__actions">
          <button class="btn btn--dark" onclick="resetTarot()">もう一度占う</button>
          <a href="astrology.html" class="btn btn--outline-light">命術占いも試す</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__logo">x — T E N</div>
    <p class="footer__text">&copy; 2026 x-TEN. All rights reserved.</p>
    <div class="footer__links">
      <a href="#">利用規約</a>
      <a href="#">プライバシーポリシー</a>
    </div>
  </footer>

  <script src="../js/tarot.js"></script>
</body>
</html>
