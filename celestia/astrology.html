<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四柱推命 × インド占星術 - x-TEN</title>
  <meta name="description" content="生年月日から四柱推命とインド占星術を融合したあなただけの運命鑑定。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/nav.css?v=1">
</head>
<body>

  <!-- Global Navigation -->
  <nav class="nav" aria-label="グローバルナビゲーション">
    <a href="../index.html" class="nav__link">
      <span class="nav__icon">&#9671;</span> TOP
    </a>
    <a href="../astrology-v2.html#hack" class="nav__link">
      <span class="nav__icon">&#9671;</span> Today's アドバイス
    </a>
    <a href="../astrology-v2.html#month" class="nav__link">
      <span class="nav__icon">&#9671;</span> This month's スケジュール
    </a>
    <a href="../astrology-v2.html#year" class="nav__link">
      <span class="nav__icon">&#9671;</span> This year's スケジュール
    </a>
    <a href="../astrology-v2.html#core" class="nav__link">
      <span class="nav__icon">&#9671;</span> あなたの基本構成
    </a>
    <a href="tarot.html" class="nav__link">
      <span class="nav__icon">&#9826;</span> タロット占い
    </a>
    <a href="../astrology-v2.html" class="plan-badge" title="プランを変更">
      <span class="plan-badge__label">PLAN</span>
      <span class="plan-badge__value">FREE</span>
    </a>
  </nav>

  <!-- Input Form -->
  <div id="phase-input">
    <section class="section-dark">
      <div class="container">
        <div class="page-hero">
          <div class="deco-divider">&#10023; &#10023; &#10023;</div>
          <h1 class="page-hero__title">四柱推命 &times; インド占星術</h1>
          <p class="page-hero__desc">
            あなたの生年月日から、東洋の四柱推命と<br>
            インド占星術の叡智を融合して鑑定します。
          </p>
        </div>
      </div>
    </section>

    <section class="section-light">
      <div class="container">
        <div class="form-section">
          <div class="form-group">
            <label class="form-group__label">生年月日</label>
            <div class="form-group__row">
              <select id="birth-year" class="form-group__select">
                <option value="">年</option>
              </select>
              <select id="birth-month" class="form-group__select">
                <option value="">月</option>
              </select>
              <select id="birth-day" class="form-group__select">
                <option value="">日</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-group__label">性別（任意）</label>
            <div class="form-group__row">
              <button id="gender-male" class="gender-btn" onclick="selectGender('male')">男性</button>
              <button id="gender-female" class="gender-btn" onclick="selectGender('female')">女性</button>
              <button id="gender-other" class="gender-btn" onclick="selectGender('other')">その他</button>
            </div>
          </div>

          <div class="text-center mt-24">
            <button class="btn btn--dark" onclick="startAstrology()">
              鑑定する
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Loading -->
  <div id="phase-loading" class="section-dark hidden">
    <div class="container">
      <div class="loading">
        <div class="loading__spinner"></div>
        <p class="loading__text">星の配置を読み解いています...</p>
      </div>
    </div>
  </div>

  <!-- Result -->
  <div id="phase-result" class="section-dark hidden">
    <div class="container">
      <div class="astro-result">
        <div class="astro-result__header">
          <div id="astro-symbol" class="astro-result__symbol"></div>
          <h2 id="astro-title" class="astro-result__title"></h2>
          <p id="astro-subtitle" class="astro-result__subtitle"></p>
        </div>

        <!-- Chart Overview -->
        <div id="astro-chart" class="astro-result__chart"></div>

        <!-- Detailed Results -->
        <div class="result__box">
          <div class="result__box-title">&#10023; 総合運</div>
          <p id="astro-overall" class="result__box-text"></p>
        </div>

        <div class="result__box">
          <div class="result__box-title">&#10023; 仕事運</div>
          <p id="astro-career" class="result__box-text"></p>
        </div>

        <div class="result__box">
          <div class="result__box-title">&#10023; 恋愛運</div>
          <p id="astro-love" class="result__box-text"></p>
        </div>

        <div class="result__box">
          <div class="result__box-title">&#10023; 金運</div>
          <p id="astro-money" class="result__box-text"></p>
        </div>

        <div class="result__box">
          <div class="result__box-title">&#10023; 健康運</div>
          <p id="astro-health" class="result__box-text"></p>
        </div>

        <div class="share-section">
          <p class="share-section__label">S H A R E</p>
          <div class="share">
            <button class="share__btn" onclick="shareTwitter()" title="Xでシェア">&#120143;</button>
            <button class="share__btn" onclick="shareLine()" title="LINEでシェア">L</button>
          </div>
        </div>

        <div class="result__actions">
          <button class="btn btn--dark" onclick="resetAstrology()">もう一度鑑定する</button>
          <a href="tarot.html" class="btn btn--outline-light">タロット占いも試す</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__logo">x — T E N</div>
    <p class="footer__text">&copy; 2026 x-TEN. All rights reserved.</p>
    <div class="footer__links">
      <a href="#">利用規約</a>
      <a href="#">プライバシーポリシー</a>
    </div>
  </footer>

  <script src="../js/astrology.js"></script>
  <script src="../js/nav.js?v=1"></script>
</body>
</html>
