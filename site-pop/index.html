<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>きょうの星占い - Pop Horoscope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../css/nav.css?v=1">
</head>
<body>

  <!-- Global Navigation -->
  <nav class="nav" aria-label="グローバルナビゲーション">
    <a href="../index.html" class="nav__link">
      <span class="nav__icon">&#9671;</span> TOP
    </a>
    <a href="../astrology-v2.html#hack" class="nav__link">
      <span class="nav__icon">&#9671;</span> Today's アドバイス
    </a>
    <a href="../astrology-v2.html#month" class="nav__link">
      <span class="nav__icon">&#9671;</span> This month's スケジュール
    </a>
    <a href="../astrology-v2.html#year" class="nav__link">
      <span class="nav__icon">&#9671;</span> This year's スケジュール
    </a>
    <a href="../astrology-v2.html#core" class="nav__link">
      <span class="nav__icon">&#9671;</span> あなたの基本構成
    </a>
  </nav>

  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-star">&#11088;</div>
      <h1 class="header-title">きょうの星占い</h1>
      <p class="header-subtitle">あなたの星座をタップしてね！</p>
      <div class="header-deco">
        <span>&#10024;</span>
        <span>&#9734;</span>
        <span>&#10024;</span>
      </div>
    </header>

    <!-- Zodiac Grid -->
    <main class="zodiac-grid" id="zodiacGrid">
      <!-- Cards are generated by JS -->
    </main>

    <!-- Result Panel -->
    <section class="result-panel" id="resultPanel">
      <div class="result-inner">
        <div class="result-header">
          <span class="result-emoji" id="resultEmoji"></span>
          <h2 class="result-sign-name" id="resultSignName"></h2>
          <p class="result-date-range" id="resultDateRange"></p>
        </div>

        <div class="result-overall">
          <p class="result-label">きょうの総合運</p>
          <div class="result-stars" id="resultOverallStars"></div>
        </div>

        <div class="result-message-box">
          <p class="result-message" id="resultMessage"></p>
        </div>

        <div class="result-categories">
          <div class="category-card">
            <span class="category-emoji">&#128151;</span>
            <p class="category-name">恋愛運</p>
            <div class="category-stars" id="resultLoveStars"></div>
          </div>
          <div class="category-card">
            <span class="category-emoji">&#128188;</span>
            <p class="category-name">仕事運</p>
            <div class="category-stars" id="resultWorkStars"></div>
          </div>
          <div class="category-card">
            <span class="category-emoji">&#128176;</span>
            <p class="category-name">金運</p>
            <div class="category-stars" id="resultMoneyStars"></div>
          </div>
        </div>

        <div class="result-lucky">
          <div class="lucky-item">
            <p class="lucky-label">ラッキーカラー</p>
            <div class="lucky-color-wrap">
              <span class="lucky-color-circle" id="luckyColorCircle"></span>
              <span class="lucky-color-name" id="luckyColorName"></span>
            </div>
          </div>
          <div class="lucky-item">
            <p class="lucky-label">ラッキーアイテム</p>
            <p class="lucky-value" id="luckyItem"></p>
          </div>
        </div>

        <div class="result-lucky-meter">
          <p class="lucky-meter-label">ラッキー度</p>
          <div class="lucky-hearts" id="luckyHearts"></div>
        </div>

        <button class="btn-retry" id="btnRetry">もう一度選ぶ</button>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-deco">&#11088; &#10024; &#11088;</div>
      <p class="footer-text">毎日の占いをお届け</p>
      <p class="footer-copy">&copy; 2026 きょうの星占い</p>
    </footer>
  </div>

  <script src="script.js"></script>
  <script src="../js/nav.js?v=1"></script>
</body>
</html>
