<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>運命星占い - Destiny Star Fortune</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="ornament-top">&#10022;</div>
      <h1 class="title">運 命 星 占 い</h1>
      <p class="subtitle">あなたの運命を、星が語る</p>
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-star">&#10022;</span>
        <span class="divider-line"></span>
      </div>
      <p class="description">
        六星の導きにより、あなたの生まれ持った<br>
        運命星と今日の運勢をお伝えいたします。
      </p>
    </header>

    <!-- Input Form -->
    <section class="form-section">
      <p class="form-label">生年月日を入力してください</p>

      <form id="fortuneForm" class="fortune-form">
        <div class="select-group">
          <div class="select-wrapper">
            <select id="birthYear" required>
              <option value="" disabled selected>年</option>
            </select>
          </div>
          <div class="select-wrapper">
            <select id="birthMonth" required>
              <option value="" disabled selected>月</option>
            </select>
          </div>
          <div class="select-wrapper">
            <select id="birthDay" required>
              <option value="" disabled selected>日</option>
            </select>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="btn-ornament-left">&#10022;</span>
          占　う
          <span class="btn-ornament-right">&#10022;</span>
        </button>
      </form>
    </section>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="loading-star">&#10022;</div>
      <p class="loading-text">星の声を聴いています...</p>
    </div>

    <!-- Result -->
    <section class="result-section" id="resultSection">

      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-star">&#10022;</span>
        <span class="divider-line"></span>
      </div>

      <div class="result-header">
        <p class="result-label">あなたの運命星</p>
        <div class="destiny-star-symbol" id="starSymbol">&#9733;</div>
        <h2 class="destiny-star-name" id="starName"></h2>
        <div class="cycle-badge" id="cycleBadge"></div>
      </div>

      <div class="divider divider-sm">
        <span class="divider-line"></span>
        <span class="divider-star">&#10022;</span>
        <span class="divider-line"></span>
      </div>

      <!-- Fortune Bars -->
      <div class="fortune-bars" id="fortuneBars">
        <div class="bar-item">
          <div class="bar-label">
            <span class="bar-name">総合運</span>
            <span class="bar-value" id="barOverall"></span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" id="fillOverall"></div>
          </div>
        </div>
        <div class="bar-item">
          <div class="bar-label">
            <span class="bar-name">恋愛運</span>
            <span class="bar-value" id="barLove"></span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" id="fillLove"></div>
          </div>
        </div>
        <div class="bar-item">
          <div class="bar-label">
            <span class="bar-name">仕事運</span>
            <span class="bar-value" id="barWork"></span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" id="fillWork"></div>
          </div>
        </div>
        <div class="bar-item">
          <div class="bar-label">
            <span class="bar-name">金運</span>
            <span class="bar-value" id="barMoney"></span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" id="fillMoney"></div>
          </div>
        </div>
        <div class="bar-item">
          <div class="bar-label">
            <span class="bar-name">健康運</span>
            <span class="bar-value" id="barHealth"></span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" id="fillHealth"></div>
          </div>
        </div>
      </div>

      <div class="divider divider-sm">
        <span class="divider-line"></span>
        <span class="divider-star">&#10022;</span>
        <span class="divider-line"></span>
      </div>

      <!-- Detailed Fortune -->
      <div class="fortune-detail" id="fortuneDetail">
        <h3 class="detail-title">今日の運勢</h3>
        <p class="detail-text" id="fortuneText"></p>
      </div>

      <div class="divider divider-sm">
        <span class="divider-line"></span>
        <span class="divider-star">&#10022;</span>
        <span class="divider-line"></span>
      </div>

      <!-- Advice -->
      <div class="fortune-advice" id="fortuneAdvice">
        <h3 class="detail-title">開運のお告げ</h3>
        <div class="advice-items">
          <div class="advice-item">
            <span class="advice-label">ラッキーカラー</span>
            <span class="advice-value" id="luckyColor"></span>
          </div>
          <div class="advice-item">
            <span class="advice-label">ラッキーナンバー</span>
            <span class="advice-value" id="luckyNumber"></span>
          </div>
          <div class="advice-item">
            <span class="advice-label">ラッキー方位</span>
            <span class="advice-value" id="luckyDirection"></span>
          </div>
        </div>
      </div>

      <!-- Warning or Blessing -->
      <div class="cycle-message" id="cycleMessage"></div>

      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-star">&#10022;</span>
        <span class="divider-line"></span>
      </div>

      <button class="retry-btn" id="retryBtn">もう一度占う</button>

    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-star">&#10022;</span>
        <span class="divider-line"></span>
      </div>
      <p class="footer-text">Destiny Star Fortune</p>
      <p class="footer-sub">&#169; 運命星占い All Rights Reserved</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
