<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Tarot - 恋のゆくえを占いましょう</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400&family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Hero -->
    <header class="hero">
      <p class="hero-label">- tarot reading -</p>
      <h1 class="hero-title">Love Tarot</h1>
      <p class="hero-subtitle">恋のゆくえを占いましょう</p>
      <div class="hero-divider">・ ・ ・</div>
    </header>

    <!-- Instruction -->
    <section id="instruction" class="instruction">
      <p class="instruction-text">心の中で想い人を思い浮かべて<br>一枚選んでください</p>
    </section>

    <!-- Card Selection -->
    <section id="card-selection" class="card-selection">
      <div class="card-arc">
        <div class="tarot-card" data-index="0" style="--i:0">
          <div class="card-inner">
            <div class="card-back">
              <div class="card-back-pattern">
                <div class="card-back-diamond"></div>
              </div>
            </div>
            <div class="card-front"></div>
          </div>
        </div>
        <div class="tarot-card" data-index="1" style="--i:1">
          <div class="card-inner">
            <div class="card-back">
              <div class="card-back-pattern">
                <div class="card-back-diamond"></div>
              </div>
            </div>
            <div class="card-front"></div>
          </div>
        </div>
        <div class="tarot-card" data-index="2" style="--i:2">
          <div class="card-inner">
            <div class="card-back">
              <div class="card-back-pattern">
                <div class="card-back-diamond"></div>
              </div>
            </div>
            <div class="card-front"></div>
          </div>
        </div>
        <div class="tarot-card" data-index="3" style="--i:3">
          <div class="card-inner">
            <div class="card-back">
              <div class="card-back-pattern">
                <div class="card-back-diamond"></div>
              </div>
            </div>
            <div class="card-front"></div>
          </div>
        </div>
        <div class="tarot-card" data-index="4" style="--i:4">
          <div class="card-inner">
            <div class="card-back">
              <div class="card-back-pattern">
                <div class="card-back-diamond"></div>
              </div>
            </div>
            <div class="card-front"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Result -->
    <section id="result" class="result hidden">
      <div class="result-card-display">
        <div class="result-card-frame">
          <span class="result-card-emoji"></span>
        </div>
        <h2 class="result-card-name"></h2>
        <p class="result-card-name-en"></p>
      </div>

      <div class="result-divider">・ ・ ・</div>

      <div class="result-section result-message">
        <h3 class="result-section-title">恋のメッセージ</h3>
        <p class="result-section-body result-message-text"></p>
      </div>

      <div class="result-section result-advice">
        <h3 class="result-section-title">アドバイス</h3>
        <p class="result-section-body result-advice-text"></p>
      </div>

      <div class="result-section result-feeling">
        <h3 class="result-section-title">相手の気持ち</h3>
        <p class="result-section-body result-feeling-text"></p>
      </div>

      <div class="result-section result-lucky">
        <h3 class="result-section-title">ラッキーデー</h3>
        <p class="result-section-body result-lucky-text"></p>
      </div>

      <div class="result-divider">・ ・ ・</div>

      <div class="share-area">
        <p class="share-label">結果をシェア</p>
        <div class="share-buttons">
          <button class="share-btn share-x" onclick="shareX()">X</button>
          <button class="share-btn share-line" onclick="shareLine()">LINE</button>
          <button class="share-btn share-copy" onclick="copyResult()">コピー</button>
        </div>
      </div>

      <button class="retry-btn" onclick="resetReading()">もう一度占う</button>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-divider">・ ・ ・</div>
      <p class="footer-text">Love Tarot</p>
      <p class="footer-sub">あなたの恋に寄り添う占い</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
